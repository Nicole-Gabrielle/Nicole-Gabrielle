<svg xmlns="http://www.w3.org/2000/svg" width="840" height="170" viewBox="0 0 840 170">
  <defs>
    <linearGradient id="bar" x1="0" x2="1">
      <stop offset="0" stop-color="#C3A6FF"/><stop offset="1" stop-color="#8EE4D6"/>
    </linearGradient>
    <pattern id="base" x="22" y="48" width="15" height="15" patternUnits="userSpaceOnUse">
      <rect width="12" height="12" rx="2" fill="#1E1A2E"/>
    </pattern>
    <pattern id="a" x="22" y="48" width="75" height="45" patternUnits="userSpaceOnUse">
      <rect x="15" width="12" height="12" rx="2" fill="#4B3A7A"/>
      <rect x="45" y="30" width="12" height="12" rx="2" fill="#C3A6FF"/>
      <rect x="60" y="15" width="12" height="12" rx="2" fill="#6B4FA0"/>
    </pattern>
    <pattern id="b" x="22" y="48" width="105" height="60" patternUnits="userSpaceOnUse">
      <rect x="30" y="15" width="12" height="12" rx="2" fill="#8EE4D6"/>
      <rect x="90" y="45" width="12" height="12" rx="2" fill="#9B7FD4"/>
      <rect x="0" y="30" width="12" height="12" rx="2" fill="#3E7F78"/>
    </pattern>
    <pattern id="c" x="22" y="48" width="165" height="105" patternUnits="userSpaceOnUse">
      <rect x="0" y="45" width="12" height="12" rx="2" fill="#8EE4D6"/>
      <rect x="120" y="90" width="12" height="12" rx="2" fill="#C3A6FF"/>
      <rect x="60" y="0" width="12" height="12" rx="2" fill="#9B7FD4"/>
      <rect x="135" y="30" width="12" height="12" rx="2" fill="#5FB8AA"/>
    </pattern>
    <pattern id="d" x="22" y="48" width="45" height="105" patternUnits="userSpaceOnUse">
      <rect x="30" y="60" width="12" height="12" rx="2" fill="#5FB8AA"/>
      <rect x="15" y="90" width="12" height="12" rx="2" fill="#4B3A7A"/>
    </pattern>
  </defs>

  <rect width="840" height="170" rx="14" fill="#0D1117" stroke="#2A2340"/>
  <text x="22" y="30" fill="#8EE4D6" font-family="monospace" font-size="13" font-weight="700" letter-spacing="4">ACTIVITY PULSE</text>
  <rect x="22" y="38" width="160" height="2" fill="url(#bar)"/>

  <rect x="22" y="48" width="795" height="105" fill="url(#base)"/>
  <rect x="22" y="48" width="795" height="105" fill="url(#a)">
    <animate attributeName="opacity" values="1;.35;1" dur="3.2s" repeatCount="indefinite"/>
  </rect>
  <rect x="22" y="48" width="795" height="105" fill="url(#b)">
    <animate attributeName="opacity" values=".4;1;.4" dur="2.6s" repeatCount="indefinite"/>
  </rect>
  <rect x="22" y="48" width="795" height="105" fill="url(#c)">
    <animate attributeName="opacity" values="1;.5;1" dur="4.1s" repeatCount="indefinite"/>
  </rect>
  <rect x="22" y="48" width="795" height="105" fill="url(#d)">
    <animate attributeName="opacity" values=".3;1;.3" dur="1.9s" repeatCount="indefinite"/>
  </rect>
</svg>
